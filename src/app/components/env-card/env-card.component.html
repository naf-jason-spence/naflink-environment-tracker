<div class="env-card" [class]="'env-card group-' + env().group" [class.is-occupied]="env().status === 'occupied'">

  <!-- Top row -->
  <div class="card-top">
    <div class="card-top-left">
      <span class="env-badge" [class]="'env-badge--' + env().group">{{ env().name }}</span>
      <span class="status-pill" [class.pill-occupied]="env().status === 'occupied'" [class.pill-free]="env().status === 'free'">
        <span class="status-dot" [class.dot-occupied]="env().status === 'occupied'" [class.dot-free]="env().status === 'free'"></span>
        {{ env().status === 'occupied' ? 'Occupied' : 'Free' }}
      </span>
    </div>

    @if (env().status === 'occupied') {
      <button class="btn-free" (click)="markFree()" title="Mark as done / free">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Done / Free
      </button>
    }

  </div>

  <!-- Fields -->
  <div class="fields">

    <div class="field-group">
      <label class="field-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
          <path d="M18 9a9 9 0 0 1-9 9"/>
        </svg>
        Branch / Repo
      </label>
      <span class="field-value mono" [class.field-value--pinned]="!!env().branchOrRepo" [class.field-value--muted]="!env().branchOrRepo">{{ env().branchOrRepo || '—' }}</span>
    </div>

    <div class="field-group">
      <label class="field-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Deployed By
      </label>
      <span class="field-value" [class.field-value--pinned]="!!env().lockedBy" [class.field-value--muted]="!env().lockedBy">{{ env().lockedBy || '—' }}</span>
    </div>

  </div>

  @if (env().lastUpdated) {
    <div class="card-footer">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Updated {{ env().lastUpdated | date:'MMM d, h:mm a' }}
    </div>
  }
</div>
