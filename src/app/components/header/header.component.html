<header class="header">
  <div class="header-inner">
    <div class="logo-area">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <div>
        <h1 class="app-title">NAFLink Deployment Tracker</h1>
        <p class="app-subtitle">Internal dashboard</p>
      </div>
    </div>

    <div class="header-actions">
      <!-- ADO sync status -->
      @if (envService.adoLoading()) {
        <span class="sync-badge sync-badge--loading">
          <svg class="spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          Syncing…
        </span>
      } @else if (envService.adoError()) {
        <span class="sync-badge sync-badge--error" [title]="envService.adoError()!">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Sync error
        </span>
      } @else if (envService.adoLastSynced()) {
        <span class="sync-badge sync-badge--ok">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Synced
        </span>
      }

      <!-- Sync from ADO -->
      <button
        class="icon-btn"
        title="Sync from ADO"
        [disabled]="envService.adoLoading()"
        (click)="onSync()"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
      </button>

    </div>
  </div>
</header>
