name: Deploy Angular to GitHub Pages

on:
  schedule:
    - cron: '*/10 * * * *'   # Refresh ADO build status every 10 minutes
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ADO_ORG: NAF-Tech
  ADO_PROJECT: LenderLink.Web
  ADO_PIPELINE_NAME: naflink-web-release-pipeline
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npx ng build --configuration production

      - name: Fetch ADO build status
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: node .github/scripts/fetch-ado-status.mjs
        continue-on-error: true   # never block deployment if ADO is unreachable

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
